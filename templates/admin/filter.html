{% load i18n %}
<div class="admin-filter-pill-container">
    <span class="admin-filter-title">{{ title }}</span>
    <ul class="admin-filter-pills">
        {% for choice in choices %}
            <li{% if choice.selected %} class="selected"{% endif %}>
                <a href="{{ choice.query_string|safe }}" title="{{ choice.display }}">
                    {{ choice.display }}
                </a>
            </li>
        {% endfor %}
    </ul>
</div>
