{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  <li>
    <button type="button" class="btn btn-danger btn-sm" onclick="
      if(confirm('Are you sure you want to delete all your notifications?')){
        var f=document.createElement('form');
        f.method='post';f.action='{{ clear_all_url }}';
        var c=document.createElement('input');
        c.type='hidden';c.name='csrfmiddlewaretoken';c.value='{{ clear_all_csrf }}';
        f.appendChild(c);document.body.appendChild(f);f.submit();
      }
    ">
      <i class="fas fa-trash"></i> Clear All Notifications
    </button>
  </li>
  {{ block.super }}
{% endblock %}
