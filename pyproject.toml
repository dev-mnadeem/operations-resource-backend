[project]
name = "arcadian-be"
version = "0.1.0"
description = "Django operations API for a multi-branch food business"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3,<6.2",
    "djangorestframework>=3.18.3,<4.0",
    "drf-spectacular>=0.30.0,<0.31",
    "django-jazzmin>=3.0.5,<4.0",
    "python-dotenv>=1.2.3,<2.0",
    "psycopg2-binary>=2.9.13,<3.0",
    "dj-database-url>=3.1,<4.0",
    "gunicorn>=26.2,<27.0",
    "whitenoise>=6.12,<7.0",
    "celery>=5.6,<5.7",
    "redis>=8.1,<9.0",
    "xlrd>=2.0.2,<3.0",
    "faker>=40.44",
    "cloudinary>=1.47.0,<2.0",
    "django-cloudinary-storage>=0.3.0,<1.0",
    "python-barcode>=0.16.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4,<0.18",
    "pre-commit>=4.7,<5.0",
]

[tool.uv]
# kombu 5.7.0 imports `packaging` in its Redis transport without declaring
# it, so the Celery worker fails to start in the production image.
constraint-dependencies = ["kombu<5.7"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "migrations",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "DJ",     # Django
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"migrations/*" = ["ALL"]  # Ignore all rules in migrations
"*/migrations/*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"


