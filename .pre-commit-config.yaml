repos:
  - repo: local
    hooks:
      # Run ruff linter through uv
      - id: ruff-check
        name: ruff check
        entry: bash -c 'uv run ruff check --fix --exit-non-zero-on-fix "$@"' --
        language: system
        types: [python]
        pass_filenames: true
      # Run ruff formatter through uv
      - id: ruff-format
        name: ruff format
        entry: bash -c 'uv run ruff format "$@"' --
        language: system
        types: [python]
        pass_filenames: true
